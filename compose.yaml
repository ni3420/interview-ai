name: interview-ai

# Local development stack:
#   - Qdrant  : vector store for resume chunks + embeddings (used by ai-service)
#   - Valkey  : Redis-compatible BullMQ backend (resume-processing queue)
#   - ai-service : Python/FastAPI service (LangChain + Ollama embeddings -> Qdrant)
#   - worker  : Node BullMQ consumer that drives resume processing
#
# Quick start:  docker compose up -d qdrant valkey
# Full stack:   docker compose up --build

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      # Loopback-only: these services have no authentication of their own and
      # must not be reachable from the local network.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      # Loopback-only: Valkey has no password in local development.
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./apps/ai-service
      args:
        # Build the realtime vision agent into the image. Set to false to skip
        # the heavy vision-agents stack when live interviews are unused.
        INSTALL_REALTIME: ${INSTALL_REALTIME:-true}
    restart: unless-stopped
    env_file:
      # Shared server-only secrets (Stream credentials) live in the root .env.
      # The service file can override them and add GEMINI_API_KEY.
      - path: ./.env
        required: false
      - path: ./apps/ai-service/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Required: the service refuses to start without a key, and there is no
      # default secret. Set AI_SERVICE_API_KEY in the root .env file.
      SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY must be set in .env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-resume_chunks}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      # Local development uses Ollama (no cloud key required). Set
      # AI_PROVIDER=gemini plus GEMINI_API_KEY to use the remote provider.
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      # Realtime vision agent. Secrets (STREAM_API_KEY, STREAM_API_SECRET,
      # GEMINI_API_KEY) come from env_file above; only non-secret overrides go
      # here, otherwise an empty ${VAR:-} default would mask env_file values.
      REALTIME_MODEL: ${REALTIME_MODEL:-gemini-3.1-flash-live-preview}
    # Lets the container reach Ollama running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback-only: the Next.js server runs on the host and needs access,
      # but the AI service must never be reachable from the local network.
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://valkey:6379
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY must be set in .env}
      # The Convex local backend runs on the host; reach it via the gateway.
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-http://host.docker.internal:3211}
      WORKER_SERVICE_KEY: ${WORKER_SERVICE_KEY:?WORKER_SERVICE_KEY must be set in .env}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      REPORT_WORKER_CONCURRENCY: ${REPORT_WORKER_CONCURRENCY:-1}
    # Lets the container persist results back to the host's Convex backend.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  qdrant_data:
  valkey_data:
